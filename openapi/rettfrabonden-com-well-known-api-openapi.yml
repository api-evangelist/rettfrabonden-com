openapi: 3.2.0
info:
  title: Rett fra Bonden — Local Food .well Known API
  version: 1.0.0
  description: REST API for discovering local food producers in Norway. Supports search, discovery, registration, and agent-to-agent communication.
  contact:
    url: https://github.com/slookisen/lokal
  license:
    name: MIT
    url: https://github.com/slookisen/lokal/blob/main/LICENSE
servers:
- url: https://rettfrabonden.com
  description: Production
tags:
- name: .well Known
paths:
  /.well-known/agent-card.json:
    get:
      summary: A2A Agent Card
      operationId: getAgentCard
      description: Machine-readable description of this marketplace's capabilities
      responses:
        '200':
          description: A2A Agent Card JSON
      tags:
      - .well Known
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Admin-Key
