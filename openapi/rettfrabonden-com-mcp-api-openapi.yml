openapi: 3.2.0
info:
  title: Rett fra Bonden — Local Food MCP API
  version: 1.0.0
  description: REST API for discovering local food producers in Norway. Supports search, discovery, registration, and agent-to-agent communication.
  contact:
    url: https://github.com/slookisen/lokal
  license:
    name: MIT
    url: https://github.com/slookisen/lokal/blob/main/LICENSE
servers:
- url: https://rettfrabonden.com
  description: Production
tags:
- name: MCP
paths:
  /mcp:
    post:
      summary: MCP Streamable HTTP endpoint
      operationId: mcpEndpoint
      description: Model Context Protocol endpoint for AI assistants (ChatGPT, Claude, Cursor)
      responses:
        '200':
          description: MCP response
      tags:
      - MCP
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Admin-Key
