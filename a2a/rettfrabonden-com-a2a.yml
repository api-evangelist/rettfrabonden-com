conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: 1.0.0
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks on the verbatim card. capabilities is an OBJECT with
    streaming, pushNotifications and stateTransitionHistory as boolean fields (pass). protocolVersion
    is present at the top level as "1.0.0" (pass). skills is an ARRAY of four fully-populated skills,
    each carrying id, name, description, tags, inputModes, outputModes and examples (pass). All three
    optional discriminators — preferredTransport, defaultInputModes, defaultOutputModes — are declared.
  deviations:
  - field: documentationUrl / provider.contactUrl
    observed: https://rettfrabonden.com/docs
    note: >-
      Returns 404. The provider's actual developer page is https://rettfrabonden.com/teknologi, which is
      what the RFC 9728 protected-resource document and the MCP server card point at. An agent following
      the card's own documentation link lands on an Express "Cannot GET /docs" page.
  - field: interfaces
    observed: non-standard top-level key carrying the JSON-RPC method list and the REST base
    note: >-
      A2A 0.3 describes secondary endpoints in additionalInterfaces (which the card ALSO carries) and
      A2A 1.0.0 in supportedInterfaces. The card mixes the 0.3 shape (top-level url + preferredTransport +
      additionalInterfaces) with a vendor "interfaces" list; the useful method enumeration lives only in
      the non-standard key.
  - field: authentication
    observed: '{"schemes":["apiKey"],"credentials":null}'
    note: Pre-0.3 authentication block retained alongside the current securitySchemes map. Harmless duplication.
  - field: security
    observed: empty array
    note: >-
      No security requirement is declared at card level even though the register-food-agent skill is
      documented (in the scheme description) as requiring X-API-Key. A reader must infer the requirement
      from prose.
  - field: securitySchemes
    observed: two schemes (apiKey, consumerApiKey) both bound to the same header name X-API-Key
    note: >-
      The card itself explains the distinction at length (producer key vs. voluntary consumer key), but
      two schemes on one header are indistinguishable to a client at the transport level.
  - field: skills
    observed: four skills; the cart / pickup-order flow that the MCP server actually exposes (lokal_cart_create … lokal_order_status) is absent
    note: >-
      The OLDER card returned by GET /a2a lists a build-shopping-cart skill and only three skills in
      total, while the well-known card lists four without it. The two cards the provider serves do not
      agree, and neither enumerates the full MCP tool surface.
  - field: signatures
    observed: one EdDSA JWS block, kid lokal-a2a-2026, no key-discovery pointer
    note: Signed cards are rare and this is a positive; recorded only because the key is not discoverable from the card.
surface_relationship:
  note: >-
    Rett fra Bonden publishes three overlapping agent surfaces over one producer registry. A2A: four
    skills at https://rettfrabonden.com/a2a, JSON-RPC 2.0, anonymous for reads. MCP: fifteen tools at
    https://rettfrabonden.com/mcp (see mcp/rettfrabonden-com-mcp.yml) — the widest surface, and the only
    one carrying the cart and pickup-order flow. REST: six operations in /openapi.yaml and eight paths in
    /openapi.json (see mcp/rettfrabonden-com-tool-crosswalk.yml). The published OpenAPI exposes the card
    itself as operation getAgentCard and the endpoint as a2aJsonRpc, so A2A is a first-class part of the
    contract rather than a side surface.
