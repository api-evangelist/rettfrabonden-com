      description: API key received upon registration. Required for write operations; read/search operations are open.
    consumerApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Free, voluntary consumer-identity key obtained via POST /api/keys; raises the rate-limit ceiling ~3x on the general REST and /a2a surface. Not required for anything.
  security: []
  signatures:
    count: 1
    alg: EdDSA
    kid: lokal-a2a-2026
    note: >-
