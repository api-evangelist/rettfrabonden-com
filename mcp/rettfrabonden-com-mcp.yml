divergences:
  note: >-
    The provider's discovery documents disagree with the live server about WHICH tools exist. Recorded
    so a reader knows which document to trust: the live tools/list capture in rettfrabonden-com-mcp-tools.json.
  items:
  - document: /.well-known/mcp/server-card.json
    claims: tools search_producers, discover_by_category, get_producer, register_producer, start_negotiation
    live: none of these five names exist; the server exposes lokal_* tools and no registration or negotiation tool
  - document: /.well-known/agent-skills/index.json
    claims: invocation.mcp.tool search_producers and discover_by_category
    live: phantom names (see above)
  - document: /llms.txt
    claims: nine tools (lokal_search .. lokal_bm_next_markets)
    live: omits the six cart/order tools that tools/list returns
  - document: README (github.com/slookisen/lokal)
    claims: four tools and two resources
    live: fifteen tools, two resources
  - document: server card
    claims: newest negotiable protocol 2025-11-25
    live: initialize with 2025-06-18 was accepted and echoed; 2025-11-25 was not tested
