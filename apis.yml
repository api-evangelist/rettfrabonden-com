- name: Rett fra Bonden MCP Server
  description: >-
    Remote MCP server (Streamable HTTP, protocol 2025-06-18 negotiated) at https://rettfrabonden.com/mcp
    with 15 tools — search, discover, producer info, umbrella organisations, Bondens marked events,
    geocoding, shopping-list offers, and an anonymous cart -> pickup-order flow — plus two resources.
    tools/list answers anonymously after initialize. Also shipped as the npm stdio package lokal-mcp
    (0.4.0) and mirrored on Smithery.
  image: https://rettfrabonden.com/logo-512.png
  humanURL: https://rettfrabonden.com/teknologi#mcp-oppsett
  baseURL: https://rettfrabonden.com/mcp
