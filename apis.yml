apis:
- name: Rett fra Bonden Local Food API
  description: >-
    REST surface at https://rettfrabonden.com/api/marketplace — natural-language search (searchFood),
    structured discovery (discoverProducers), producer detail (getProducerInfo), Norwegian place
    geocoding (geocodePlace), an ACP-conformant CSV product feed (getAcpProductFeed) and platform
    statistics (getPlatformStats). Reads are open with no credential; producer registration and other
    writes require X-API-Key. Two first-party OpenAPI 3.1.0 documents are published: /openapi.yaml
    (richer schemas, 6 operations) and /openapi.json (8 paths including register, /a2a and /mcp).
  image: https://rettfrabonden.com/logo-512.png
  humanURL: https://rettfrabonden.com/teknologi
  baseURL: https://rettfrabonden.com/api/marketplace
