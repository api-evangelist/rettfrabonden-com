x-operator: Daniel Fredriksen (individual operator; non-profit initiative per /om and /terms)
x-headquarters: Norway
x-sibling-verticals:
  note: >-
    The same open-source codebase (slookisen/lokal) serves two sibling verticals on other domains —
    finn-tannlege.com (dental) and opplevagent.no (experiences). They are separate products with their
    own MCP/A2A routes and are NOT profiled here; every artifact in this repo was fetched from
    rettfrabonden.com or lokal.fly.dev (the Fly.io origin of the same app) and describes only the
    local-food surface.
