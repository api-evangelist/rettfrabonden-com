- name: Rett fra Bonden A2A Agent
  description: >-
    A2A JSON-RPC 2.0 endpoint at https://rettfrabonden.com/a2a (message/send, tasks/get, tasks/list,
    agent/authenticatedExtendedCard) described by an EdDSA-signed agent card served at
    /.well-known/agent-card.json (and the legacy /.well-known/agent.json). Four declared skills:
    discover-local-food-agents, register-food-agent, search-compare-food, agent-conversation.
  image: https://rettfrabonden.com/logo-512.png
