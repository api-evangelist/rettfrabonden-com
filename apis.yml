aid: rettfrabonden-com
name: Rett fra Bonden
description: >-
  Rett fra Bonden (rettfrabonden.com) is an open, non-profit discovery layer for local food in
  Norway — a registry of 1,900+ farms, farm shops, REKO rings, farmers' markets and cooperatives
  that is built to be read by AI agents first. It exposes the same producer catalogue through three
  protocols: a REST API (natural-language and structured search, producer detail, geocoding, an
  ACP-conformant product feed), a remote MCP server at /mcp with 15 tools including an anonymous
  shopping-cart and pickup-order flow, and an A2A JSON-RPC endpoint at /a2a described by a signed
  agent card at /.well-known/agent-card.json. Reads are open without a key; producer registration
  requires an X-API-Key issued on registration. The code is MIT-licensed at github.com/slookisen/lokal
  and the platform is operated in Norway by Daniel Fredriksen.
