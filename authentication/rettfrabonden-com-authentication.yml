summary:
  types: [apiKey, none]
  api_key_in: [header]
  oauth2_flows: []
  model: >-
    Reads are open. Every search/discover/detail/geocode/stats operation, the whole MCP tool surface
    (including the anonymous cart flow) and the A2A message/send and tasks/* methods answer with no
    credential. The ONE key-gated write is producer registration (POST /api/marketplace/register),
    which requires an X-API-Key. A second, voluntary X-API-Key — the "consumer key" from POST /api/keys —
    exists only to raise the caller's rate-limit ceiling and to attribute usage; it is not a login.
    There is no OAuth, no OIDC and no bearer-token issuance: the RFC 9728 protected-resource document
    declares authorization_servers [] and names the API key as the credential in vendor x-auth-* fields.
schemes:
- name: apiKey
  type: apiKey
  in: header
  parameter: X-API-Key
  role: producer key
  required_for: [registerProducer, producer-side writes documented as "write operations"]
  obtain: 'issued in the response to POST /api/marketplace/register (openapi.json: "Registered agent with API key"; protected-resource x-auth-obtain-url)'
  scopes: [write]
  sources: [a2a/rettfrabonden-com-agent-card.json, well-known/rettfrabonden-com-oauth-protected-resource.json, well-known/rettfrabonden-com-mcp-server-card.json]
  description: API key received upon registration. Required for write operations; read/search operations are open.
- name: consumerApiKey
  type: apiKey
  in: header
  parameter: X-API-Key
  role: voluntary consumer-identity key for AI agents
  required_for: []
  obtain: POST https://rettfrabonden.com/api/keys with optional JSON body {label, contact_email}; the key is returned once and cannot be retrieved again
  revoke: POST https://rettfrabonden.com/api/keys/revoke (stops the key, keeps history) or POST https://rettfrabonden.com/api/keys/erase (GDPR erasure of label/e-mail); both take {key} in the body or the key as X-API-Key
  effect: about 3x higher rate-limit ceiling on the general REST and /a2a surface (300 -> 900 and 200 -> 600 per 15 minutes) and a per-key usage ledger (endpoint/tool name and date only); does NOT raise the static 150-per-15-minute quota on /api/marketplace/search and /discover
  scopes: [read]
  sources: [a2a/rettfrabonden-com-agent-card.json, llms/rettfrabonden-com-llms.txt]
  description: Free, voluntary key — same header name as the producer key, different purpose; nothing requires it.
- name: adminKey
  type: apiKey
  in: header
  parameter: X-Admin-Key
  role: operator/admin key
  required_for: [admin routes — not part of the public surface]
  scopes: []
  sources: [openapi/rettfrabonden-com-agent-surface-openapi.json]
  description: >-
    The only securityScheme declared in /openapi.json, and the scheme that spec attaches to registerProducer.
    Every other provider document (agent card, protected-resource metadata, server card, /api index,
    agents.txt) says registration is gated by X-API-Key, not X-Admin-Key. Recorded as spec drift; the
    privacy page describes admin access as "protected with API keys in environment variables", i.e. an
    operator credential.
